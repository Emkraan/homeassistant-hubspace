name: Feature request
description: Suggest a new entity, device type, or capability.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the *outcome* you want, not just the implementation — that lets us evaluate whether Afero's cloud API can actually support it before promising work.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "e.g. My freezer's error sensor doesn't show up as a binary_sensor."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      placeholder: "e.g. Map functionClass X on device class Y to a new binary_sensor."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've thought about solving this — template sensors, automations, third-party tools.

  - type: textarea
    id: api_evidence
    attributes:
      label: Device payload evidence (very helpful)
      description: |
        Afero's own device metadata is not always self-describing, so new device types/quirks usually need a raw payload to add correctly. Enable debug logging (`custom_components.hubspace: debug`), reproduce, and paste the relevant device's raw `functions`/`states` JSON here. Redact anything identifying (serials, location names).
      render: json

  - type: input
    id: device_model
    attributes:
      label: Device model
      placeholder: "e.g. Zandra ceiling fan"

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and Discussions for similar requests.
          required: true
        - label: I understand this integration only exposes data the Afero cloud API actually returns.
          required: true
